version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: nyaya_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyaya_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyaya_password}
      POSTGRES_DB: ${POSTGRES_DB:-nyaya_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyaya_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nyaya_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyaya_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nyaya_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nyaya.ai
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  pgadmin_data:
